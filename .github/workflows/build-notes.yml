name: Build LaTeX Notes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-english \
            latexmk \
            make

      - name: Build EENG4312 notes with Makefile
        working-directory: ./EENG4312
        run: make

      # Add more classes later, e.g.:
      # - name: Build EENG4310 notes with Makefile
      #   working-directory: ./EENG4310
      #   run: make

      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-notes
          path: |
            eeng4312-comm/build/*.pdf
